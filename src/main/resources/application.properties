spring.datasource.url=jdbc:mysql://localhost:3306/websitedb
spring.datasource.username=company
spring.datasource.password=company@123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

server.port=8080

# JWT Configuration
jwt.secret=YourSuperSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong
jwt.expiration=86400000

# Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=YOUR_GMAIL_EMAIL@gmail.com
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.show-actuator=false

# Logging Configuration
logging.level.org.springframework.web=INFO
logging.level.org.springdoc=INFO

# Frontend Configuration
app.frontend.url=http://localhost:4200

# Admin Configuration
# For production, use environment variables: ${ADMIN_USERNAME:admin}, ${ADMIN_PASSWORD:CHANGE_THIS_PASSWORD}
app.admin.username=admin@ajalkarbill.com
app.admin.password=Admin@123
app.admin.role=ADMIN

# Auto Excel Export Configuration
app.auto.export.enabled=true
app.auto.export.directory=./exports
app.auto.export.interval.minutes=30